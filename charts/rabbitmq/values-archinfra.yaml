# Archinfra production defaults layered on top of the upstream-derived values.yaml.
# Upstream compatibility lives in values.yaml; production ownership lives here.

global:
  # Historical archinfra compatibility default. For durable production workloads,
  # prefer a tested low-latency block/local-SSD/NVMe StorageClass.
  defaultStorageClass: nfs
  security:
    allowInsecureImages: true

archinfra:
  diskFreeLimit: 2GB
  storage:
    compatibilityDefault: nfs
    recommendation: fast-block-or-local-ssd
  monitoring:
    queueReadyWarning: 10000
    queueUnackedWarning: 5000
    redeliveryRateWarning: 10
    raftIndexLagWarning: 1000

image:
  registry: sealos.hub:5000
  repository: kube4/rabbitmq
  tag: 4.3.6-r1
  pullPolicy: IfNotPresent

replicaCount: 3
# Production replicas should land on distinct Kubernetes nodes. Single-node
# development/E2E environments must override this to soft explicitly.
podAntiAffinityPreset: hard
terminationGracePeriodSeconds: 180

pdb:
  create: true
  maxUnavailable: 1

usePasswordFiles: true
auth:
  username: admin
  password: ""
  erlangCookie: ""
  securePassword: true
  updatePassword: false
  existingPasswordSecret: ""
  existingSecretPasswordKey: rabbitmq-password
  existingErlangSecret: ""
  existingSecretErlangKey: rabbitmq-erlang-cookie

# RabbitMQ 4.3 uses Khepri as its only metadata store. The old upstream
# clustering.partitionHandling value is retained in values.yaml only for chart
# compatibility; config-secret.yaml removes cluster_partition_handling for 4.3+.
clustering:
  enabled: true
  addressType: hostname
  forceBoot: false
  rebalance: false

queue_leader_locator: balanced

persistence:
  enabled: true
  # Compatibility default, not the preferred durable-production storage class.
  storageClass: nfs
  size: 20Gi

persistentVolumeClaimRetentionPolicy:
  enabled: true
  whenScaled: Retain
  whenDeleted: Retain

resourcesPreset: none
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "1"
    memory: 2Gi

# Use an absolute watermark so RabbitMQ does not derive a memory threshold from
# node-visible host memory that can exceed the container cgroup limit.
memoryHighWatermark:
  enabled: true
  type: absolute
  value: 1280Mi

networkPolicy:
  enabled: true
  # Compatibility baseline. Strict environments should replace these broad
  # allowances with namespace/pod/CIDR-specific ingress and egress rules.
  allowExternal: true
  allowExternalEgress: true
  addExternalClientAccess: true

service:
  type: ClusterIP

metrics:
  enabled: true
  serviceMonitor:
    labels:
      monitoring.archinfra.io/stack: default
    default:
      enabled: true
      interval: 30s
      scrapeTimeout: ""
    perObject:
      enabled: false
    # RabbitMQ 4.3 recommends the selective detailed endpoint when only a
    # small set of per-queue/Raft metric families is needed. Metrics from this
    # endpoint use the rabbitmq_detailed_ prefix.
    detailed:
      enabled: true
      family:
        - queue_coarse_metrics
        - queue_consumer_count
        - ra_metrics
      interval: 30s
      scrapeTimeout: ""
  prometheusRule:
    enabled: true
    additionalLabels:
      monitoring.archinfra.io/stack: default
    rules:
      - alert: RabbitMQTargetDown
        expr: up{service="{{ template "common.names.fullname" . }}"} == 0
        for: 5m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: RabbitMQ Prometheus target is down
          description: Prometheus cannot scrape a RabbitMQ node for 5 minutes.
      - alert: RabbitMQClusterNodeMissing
        expr: (count(rabbitmq_identity_info{service="{{ template "common.names.fullname" . }}"}) or vector(0)) < {{ .Values.replicaCount }}
        for: 5m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: RabbitMQ cluster has fewer running nodes than expected
          description: The number of RabbitMQ identities is below the configured replica count.
      - alert: RabbitMQMemoryHigh
        expr: rabbitmq_process_resident_memory_bytes{service="{{ template "common.names.fullname" . }}"} / clamp_min(rabbitmq_resident_memory_limit_bytes{service="{{ template "common.names.fullname" . }}"}, 1) > 0.80
        for: 10m
        labels:
          severity: warning
          category: capacity
        annotations:
          summary: RabbitMQ memory usage exceeds 80% of the configured watermark
          description: Sustained high memory usage can trigger publisher flow control.
      - alert: RabbitMQMemoryCritical
        expr: rabbitmq_process_resident_memory_bytes{service="{{ template "common.names.fullname" . }}"} / clamp_min(rabbitmq_resident_memory_limit_bytes{service="{{ template "common.names.fullname" . }}"}, 1) > 0.95
        for: 5m
        labels:
          severity: critical
          category: capacity
        annotations:
          summary: RabbitMQ memory usage is near the configured watermark
          description: RabbitMQ is close to its memory alarm threshold.
      - alert: RabbitMQDiskFreeLow
        expr: rabbitmq_disk_space_available_bytes{service="{{ template "common.names.fullname" . }}"} < rabbitmq_disk_space_available_limit_bytes{service="{{ template "common.names.fullname" . }}"}
        for: 5m
        labels:
          severity: critical
          category: storage
        annotations:
          summary: RabbitMQ disk free alarm threshold reached
          description: Available disk space is below RabbitMQ's configured free-disk limit.
      - alert: RabbitMQFileDescriptorsHigh
        expr: rabbitmq_process_open_fds{service="{{ template "common.names.fullname" . }}"} / clamp_min(rabbitmq_process_max_fds{service="{{ template "common.names.fullname" . }}"}, 1) > 0.85
        for: 10m
        labels:
          severity: warning
          category: capacity
        annotations:
          summary: RabbitMQ file descriptor usage is high
          description: File descriptor usage has exceeded 85% for 10 minutes.
      - alert: RabbitMQErlangProcessesHigh
        expr: rabbitmq_erlang_processes_used{service="{{ template "common.names.fullname" . }}"} / clamp_min(rabbitmq_erlang_processes_limit{service="{{ template "common.names.fullname" . }}"}, 1) > 0.85
        for: 10m
        labels:
          severity: warning
          category: capacity
        annotations:
          summary: RabbitMQ Erlang process usage is high
          description: Erlang process usage has exceeded 85% of the VM limit.
      - alert: RabbitMQQueueReadyBacklogHigh
        expr: sum(rabbitmq_detailed_queue_messages_ready{service="{{ template "common.names.fullname" . }}"}) > {{ .Values.archinfra.monitoring.queueReadyWarning }}
        for: 15m
        labels:
          severity: warning
          category: queue
        annotations:
          summary: RabbitMQ ready-message backlog is high
          description: Total ready-message backlog exceeded the configured warning threshold.
      - alert: RabbitMQQueueUnackedHigh
        expr: sum(rabbitmq_detailed_queue_messages_unacked{service="{{ template "common.names.fullname" . }}"}) > {{ .Values.archinfra.monitoring.queueUnackedWarning }}
        for: 15m
        labels:
          severity: warning
          category: queue
        annotations:
          summary: RabbitMQ unacknowledged-message count is high
          description: Consumers are holding more unacknowledged messages than the configured threshold.
      - alert: RabbitMQRedeliveryRateHigh
        expr: sum(rate(rabbitmq_global_messages_redelivered_total{service="{{ template "common.names.fullname" . }}"}[5m])) > {{ .Values.archinfra.monitoring.redeliveryRateWarning }}
        for: 10m
        labels:
          severity: warning
          category: messaging
        annotations:
          summary: RabbitMQ message redelivery rate is high
          description: Sustained redeliveries can indicate consumer failures or acknowledgement problems.
      - alert: RabbitMQUnroutableMessages
        expr: sum(rate(rabbitmq_global_messages_unroutable_dropped_total{service="{{ template "common.names.fullname" . }}"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
          category: messaging
        annotations:
          summary: RabbitMQ is dropping unroutable messages
          description: Non-mandatory publishes are being dropped as unroutable.
      - alert: RabbitMQRaftCommitLagHigh
        expr: max(rabbitmq_detailed_raft_last_written_index{service="{{ template "common.names.fullname" . }}"} - rabbitmq_detailed_raft_commit_index{service="{{ template "common.names.fullname" . }}"}) > {{ .Values.archinfra.monitoring.raftIndexLagWarning }}
        for: 10m
        labels:
          severity: warning
          category: quorum
        annotations:
          summary: RabbitMQ Raft commit index is lagging
          description: A quorum queue or other Raft group has sustained uncommitted log entries.
      - alert: RabbitMQPodRestarting
        expr: increase(kube_pod_container_status_restarts_total{namespace="{{ include "common.names.namespace" . }}",container="rabbitmq"}[15m]) > 2
        for: 5m
        labels:
          severity: warning
          category: kubernetes
        annotations:
          summary: RabbitMQ Pod is repeatedly restarting
          description: RabbitMQ restarted more than twice in the last 15 minutes.
      - alert: RabbitMQPodOOMKilled
        expr: max_over_time(kube_pod_container_status_last_terminated_reason{namespace="{{ include "common.names.namespace" . }}",container="rabbitmq",reason="OOMKilled"}[15m]) > 0
        for: 1m
        labels:
          severity: critical
          category: kubernetes
        annotations:
          summary: RabbitMQ Pod was OOMKilled
          description: A RabbitMQ container was terminated by the kernel OOM killer.
      - alert: RabbitMQPVCUsageWarning
        expr: kubelet_volume_stats_used_bytes{namespace="{{ include "common.names.namespace" . }}",persistentvolumeclaim=~"data-{{ template "common.names.fullname" . }}-.*"} / clamp_min(kubelet_volume_stats_capacity_bytes{namespace="{{ include "common.names.namespace" . }}",persistentvolumeclaim=~"data-{{ template "common.names.fullname" . }}-.*"}, 1) > 0.80
        for: 15m
        labels:
          severity: warning
          category: storage
        annotations:
          summary: RabbitMQ PVC usage exceeds 80%
          description: RabbitMQ persistent volume usage is above the warning threshold.
      - alert: RabbitMQPVCUsageCritical
        expr: kubelet_volume_stats_used_bytes{namespace="{{ include "common.names.namespace" . }}",persistentvolumeclaim=~"data-{{ template "common.names.fullname" . }}-.*"} / clamp_min(kubelet_volume_stats_capacity_bytes{namespace="{{ include "common.names.namespace" . }}",persistentvolumeclaim=~"data-{{ template "common.names.fullname" . }}-.*"}, 1) > 0.90
        for: 10m
        labels:
          severity: critical
          category: storage
        annotations:
          summary: RabbitMQ PVC usage exceeds 90%
          description: RabbitMQ persistent volume is close to exhaustion.
  dashboards:
    enabled: true
    labels:
      grafana_dashboard: "1"
      monitoring.archinfra.io/stack: default
    annotations:
      grafana_folder: Middleware/RabbitMQ

volumePermissions:
  enabled: false
  image:
    registry: sealos.hub:5000
    repository: kube4/os-shell
    tag: 12-r1
    pullPolicy: IfNotPresent
  resourcesPreset: none
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
