{{- if or (empty .Values.configurationExistingSecret) .Values.advancedConfiguration }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-config" (include "common.names.fullname" .) }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{- if empty .Values.configurationExistingSecret }}
  {{- $renderedConfiguration := include "common.tplvalues.render" (dict "value" .Values.configuration "context" $) }}
  {{- if semverCompare ">=4.3.0-0" .Chart.AppVersion }}
  {{- $renderedConfiguration = regexReplaceAll "(?m)^cluster_partition_handling[[:space:]]*=.*(?:\\n|$)" $renderedConfiguration "" }}
  {{- $renderedConfiguration = regexReplaceAll "(?m)^queue_master_locator[[:space:]]*=.*(?:\\n|$)" $renderedConfiguration "" }}
  {{- end }}
  {{- /* Helm 4 exposes .Values as chartutil/common.Values rather than a plain map in some contexts. */}}
  {{- /* index works with both representations, while Sprig dig requires map[string]interface{}. */}}
  {{- $archinfra := (index .Values "archinfra") | default dict }}
  {{- $diskFreeLimit := (index $archinfra "diskFreeLimit") | default "" }}
  {{- if $diskFreeLimit }}
  {{- $renderedConfiguration = printf "%s\n# Archinfra production disk guardrail\ndisk_free_limit.absolute = %s\n" $renderedConfiguration $diskFreeLimit }}
  {{- end }}
  rabbitmq.conf: |-
    {{- $renderedConfiguration | b64enc | nindent 4 }}
  {{- end }}
  {{- if .Values.advancedConfiguration }}
  advanced.config: |-
    {{- include "common.tplvalues.render" (dict "value" .Values.advancedConfiguration "context" $) | b64enc | nindent 4 }}
  {{- end }}
{{- end }}
