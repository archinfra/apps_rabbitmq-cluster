name: Build RabbitMQ Cluster Offline Installer

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths:
      - ".github/workflows/build-offline-installer.yml"
      - "build.sh"
      - "install.sh"
      - "README.md"
      - "VERSION"
      - "UPSTREAM.yaml"
      - "images/**"
      - "runtime/**"
      - "scripts/**"
      - "charts/**"
  pull_request:
    paths:
      - ".github/workflows/build-offline-installer.yml"
      - "build.sh"
      - "install.sh"
      - "README.md"
      - "VERSION"
      - "UPSTREAM.yaml"
      - "images/**"
      - "runtime/**"
      - "scripts/**"
      - "charts/**"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            uname: x86_64
            kind_sha256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
          - arch: arm64
            runner: ubuntu-24.04-arm
            uname: aarch64
            kind_sha256: 20022bee6cfcd5086cb7234d218e3454e6090022f2a8f55d1fa7fcf42c3867a2
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify native runner architecture
        run: test "$(uname -m)" = "${{ matrix.uname }}"

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Install kind
        run: |
          curl -fsSL -o /tmp/kind "https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-${{ matrix.arch }}"
          echo "${{ matrix.kind_sha256 }}  /tmp/kind" | sha256sum -c -
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          kind version

      - name: Ensure executable permissions
        run: chmod +x build.sh install.sh scripts/validate-upstream-contract.py scripts/test-kind-cluster-e2e.sh scripts/rabbitmq-upgrade-preflight.sh

      - name: Validate production contract
        run: |
          python3 scripts/validate-upstream-contract.py
          bash -n scripts/rabbitmq-upgrade-preflight.sh

      - name: Build installer
        run: ./build.sh --arch "${{ matrix.arch }}"

      - name: Validate RabbitMQ runtime contract
        run: |
          image="archinfra-payload/rabbitmq:4.3.6-r1-${{ matrix.arch }}"
          docker run --rm --entrypoint /bin/bash "$image" -ec '
            test "$(id -u)" = "1001"
            test "$OS_FLAVOUR" = "debian-12"
            test -x /opt/bitnami/scripts/rabbitmq/entrypoint.sh
            test -x /opt/bitnami/scripts/rabbitmq/run.sh
            test -x /opt/bitnami/scripts/rabbitmq/nodeshutdown.sh
            test -x /opt/bitnami/scripts/rabbitmq/waitforsafeshutdown.sh
            test -x /opt/bitnami/rabbitmq/sbin/rabbitmq-server
            test -x /opt/bitnami/rabbitmq/sbin/rabbitmqctl
            test -f /opt/bitnami/erlang/releases/27/OTP_VERSION
            grep -Fx "27.3.4.16" /opt/bitnami/erlang/releases/27/OTP_VERSION
            /opt/bitnami/erlang/bin/erl -noshell -eval '\''io:format("~s", [erlang:system_info(otp_release)]), halt().'\'' | grep -Fx "27"
            rabbitmqctl --version 2>&1 | grep -Fq "4.3.6"
            ! grep -Fq "cluster_partition_handling = ${RABBITMQ_CLUSTER_PARTITION_HANDLING}" /opt/bitnami/scripts/librabbitmq.sh
            password_file="$(mktemp)"
            cookie_file="$(mktemp)"
            printf "%s" "file-password-contract" > "$password_file"
            printf "%s" "file-cookie-contract" > "$cookie_file"
            export RABBITMQ_PASSWORD_FILE="$password_file"
            export RABBITMQ_ERL_COOKIE_FILE="$cookie_file"
            . /opt/bitnami/scripts/rabbitmq-env.sh
            test "$RABBITMQ_PASSWORD" = "file-password-contract"
            test "$RABBITMQ_ERL_COOKIE" = "file-cookie-contract"
            rm -f "$password_file" "$cookie_file"
          '

      - name: Validate helper runtime contract
        run: |
          image="archinfra-payload/os-shell:12-r1-${{ matrix.arch }}"
          docker run --rm "$image" -ec 'command -v bash; command -v find; command -v xargs; command -v chown'

      - name: Run three-node RabbitMQ quorum E2E
        run: |
          ./scripts/test-kind-cluster-e2e.sh \
            "archinfra-payload/rabbitmq:4.3.6-r1-${{ matrix.arch }}" \
            "archinfra-payload/os-shell:12-r1-${{ matrix.arch }}"

      - name: Verify installer checksum
        run: |
          cd dist
          sha256sum -c <(printf "%s  %s\n" "$(cat rabbitmq-cluster-installer-${{ matrix.arch }}.run.sha256)" "rabbitmq-cluster-installer-${{ matrix.arch }}.run")

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rabbitmq-cluster-installer-${{ matrix.arch }}
          path: |
            dist/rabbitmq-cluster-installer-${{ matrix.arch }}.run
            dist/rabbitmq-cluster-installer-${{ matrix.arch }}.run.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*