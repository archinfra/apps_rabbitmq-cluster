component: rabbitmq-cluster

chart:
  upstream: bitnami/rabbitmq
  upstreamVersion: 16.0.16
  forkVersion: 16.0.16-archinfra.1
  ownership: archinfra-fork

rabbitmq:
  version: 4.3.6
  source: rabbitmq/rabbitmq-server
  runtimeStrategy: archinfra-owned-compatible-runtime

erlang:
  version: 27.3.4

runtime:
  os: debian-12
  user: 1001
  compatibilityContract: bitnami-rabbitmq-runtime-v1
  bitnamiReference:
    repository: bitnami/containers
    path: bitnami/rabbitmq/4.3/debian-12
  note: >-
    The Bitnami runtime shell contract is transitional. Archinfra owns the
    production image and will replace compatibility helpers only after their
    behavior is covered by tests.

images:
  rabbitmq: sealos.hub:5000/kube4/rabbitmq:4.3.6-r1
  helper: sealos.hub:5000/kube4/os-shell:1.37.0-glibc

upgradePolicy:
  supportedSeriesPath:
    - 4.1.x
    - 4.2.x
    - 4.3.x
  direct41To43: false
  requireStableFeatureFlagsBeforeSeriesUpgrade: true

maintenanceRules:
  - Evaluate RabbitMQ security releases independently from the upstream chart appVersion.
  - Do not ship bitnamilegacy RabbitMQ images in the production BOM.
  - Keep RabbitMQ and Erlang compatibility explicit and CI validated.
  - Validate new installs and supported in-place upgrade paths separately.
